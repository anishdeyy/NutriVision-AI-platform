version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrivision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutrivision
      POSTGRES_PASSWORD: nutrivision_password
      POSTGRES_DB: nutrivision_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrivision -d nutrivision_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nutrivision_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://nutrivision:nutrivision_password@postgres:5432/nutrivision_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - backend_reports:/app/reports

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nutrivision_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  backend_reports:
